# The suites, on every pull request, in the merge queue and on main (CONTRIBUTING.md, *CI layout*). Each runs in an isolated HOME on a private tmux socket
# against the compiled fake claude (tests/fake-claude.c): no real session, no network. The releaser merges a PR only when
# this is green. smoke.yml carries the on-demand macOS leg.
#
# Runs on GitHub's hosted runners (`ubuntu-latest`). A hosted runner is a bare image, so each job that needs tools calls the
# local action `.github/actions/hosted-tools` (Python 3.14, uv, tmux, lsof, ttyd 1.7.7, a Chrome check). CONTRIBUTING.md, *CI*.
#
# SHARDING BY RECORDED TIMES. Both families of tests are split the way large open-source projects split a slow run (pytest-split's
# `least_duration`, CircleCI's split by timings): a committed file records how long each test took (tests/timings.json for the shell
# suites, web/tests/timings.json for the web test files), and .github/scripts/deal.py deals them to the shards by greedy longest-first
# bin packing, so the slowest shard, which sets the wall time, is as light as the tests allow. The suites run in two `suites-shard`
# jobs and the web tests in six `web-shard` jobs; the jobs named `suites` and `web` (the required checks) are the gates over them. A test
# missing from the file weighs the median recorded time, so a new test never breaks the deal. The files are refreshed from CI's own logs
# by .github/scripts/update_timings.py (CONTRIBUTING.md, *Timings*). Deviation from the usual shape of a matrix: the shard jobs are not
# the required checks, because a matrix job's name carries its index (`suites-shard (1)`) and a required check is a fixed name;
# the gate job with the old name stays the check, as `web` already was.
#
# THE LAYOUT, and why. The usual one: the merge queue is the full gate on the exact tree that lands, a pull request gets fast feedback, and a push to main
# tests nothing again.
# - A MERGE-QUEUE ENTRY RUNS EVERY SUITE AND THE WEB TESTS IN FULL (event `merge_group`, GitHub's queue; or a push to `queue/**`, sala's queue, docs/merge-queues.md).
#   The checkout is the commit that main becomes, so what passes there is what lands: main stays green without a second run, and a suite that
#   tests/suites.map missed on a pull request fails here, before the merge, instead of after it.
# - A PULL REQUEST RUNS ONLY WHAT THE CHANGE REACHES, for quick feedback. `changes` first runs `tests/suitemap.sh --check` (a suite without a line, a tracked file
#   no line or glob covers, a line naming a file that is gone: the job and so the PR fail), and changed.sh then names the suites in its `suites` output (`all`, or the
#   names; a docs-only change names none and the job is skipped). tests/suites.map lists, per suite, the tracked files it opened under strace.
#   `web` (the web app's pytest, in `web-shard` jobs gathered by the gate job `web`) runs only when something under web/ changed.
# - A PUSH TO MAIN RUNS NO SUITE: `changes` only (the map check). The commit pushed is the one the queue tested, so a rerun would test the same tree twice
#   (a full run's worth of runner minutes). `suites` and `web` report "skipped" on it, which a required check accepts and release.sh reads as a verdict.
#   A direct push to main cannot skip the gate this way: the branch ruleset refuses a push of a commit the required checks have not passed on.
# - A RELEASE TAKES THE COMMIT THE QUEUE TESTED: release.sh enqueues the PR pinned to its head, waits for MERGED and deploys the merge commit GitHub made.
# A job that is not needed reports "skipped", which release.sh's check gate reads as a verdict; a workflow kept from running by `on: paths` would report nothing,
# and the gate would wait on it. Job names stay: the branch ruleset and release.sh read `changes`, `suites` and `web` (`web` stays the name of the one check
# for the web tests), and a required check that never reports makes the queue wait until its timeout, so every required job reports on every event.
# `gate` is the one job that always runs and fails only when `changes`, `suites` or `web` failed or was cancelled (skipped counts as passing); it is the check
# `.github/mergequeue.toml` names for sala's queue, which reads a skipped job as not passed.
#
# The events. GitHub's queue: `merge_group` (types: checks_requested), on the branch `gh-readonly-queue/main/pr-<n>-<sha>`. That branch is NOT in the `push` list
# below (the event is the trigger; both would run every entry twice). sala's queue: a push to `queue/**` (main plus the PRs ahead plus this one).
name: tests
on:
  pull_request:
  push:
    branches: [main, 'queue/**']   # main: `changes` only, no suite (above); queue/** : sala's merge queue (`salamander mq`) tests each entry on a branch of that name, in full
  merge_group:             # GitHub's merge queue: an entry runs every suite (the full gate); not in `push` (that would run it twice)
    types: [checks_requested]
permissions:   # nothing here writes or calls the API
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    outputs:
      sala: ${{ steps.paths.outputs.sala }}
      web: ${{ steps.paths.outputs.web }}
      suites: ${{ steps.paths.outputs.suites }}   # `all`, the suite names to run (space-separated), or empty
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # the runner context is not available in a job-level env, so this is a step
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the diff needs its other end: the merge commit's first parent on a PR
      - name: tests/suites.map is honest (git and bash only, a second; every suite has its line, every file is covered or named)
        run: bash tests/suitemap.sh --check
      - id: paths
        name: what the change touches (a PR, its merge commit against main; a queue entry, everything; a push to main, nothing; .github/scripts/changed.sh)
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            # the checkout is GitHub's merge of the PR into main (refs/pull/N/merge): its first parent is main as merged
            # against; anything else (no merge commit, another head) is read as "everything changed"
            if [ "$(git rev-parse -q --verify HEAD^2 2>/dev/null)" = "$PR_HEAD" ]; then from=HEAD^1; else from=none; fi; to=HEAD
          elif [ "$EVENT" = merge_group ] || [ "$GITHUB_REF" != refs/heads/main ]; then
            # a queue entry (GitHub's merge_group, or a push to a queue/** branch of sala's queue): the full gate on the tree that lands. `none` is a range changed.sh
            # cannot resolve, which it reads as everything changed: every suite, and the web tests when web/pyproject.toml exists
            from=none; to=HEAD
          else
            # a push to main: the commit was tested in the queue, so nothing runs again (the map check above still ran)
            echo "a push to main: no suite and no web test run again; the queue tested this commit"
            printf 'sala=false\nweb=false\nsuites=\n' | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/scripts/changed.sh "$from" "$to" | tee -a "$GITHUB_OUTPUT"
  suites-shard:
    # The shell suites, tests/*.sh, in two shards that run side by side. Each runs its share of the suites, dealt by their recorded
    # times (tests/run.sh --shard K/N → .github/scripts/deal.py, tests/timings.json: SHARDING BY RECORDED TIMES above), the longest first,
    # at most two per CPU at once as before. The check every consumer reads is the `suites` job below, which gathers the shards.
    name: suites-shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.sala == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false   # every shard reports, so one red shard does not hide another's failures
      matrix:
        shard: [1, 2]
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # the runner context is not available in a job-level env, so this is a step
      - uses: actions/checkout@v4
      - id: plan
        name: this runner's share of the suites (none when a small selection left this shard nothing, and then the rest of the job is skipped)
        env:
          SUITES: ${{ needs.changes.outputs.suites }}   # `all` (a queue entry), or names from tests/suitemap.sh --select (a PR): words, split below
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}   # the length of the matrix above
        run: |
          names=(); if [ -n "$SUITES" ] && [ "$SUITES" != all ]; then names=($SUITES); fi
          share=$(bash tests/run.sh --shard "$SHARD/$SHARDS" --list "${names[@]}")
          echo "runner $SHARD of $SHARDS: ${share:-no suite}"
          if [ -n "$share" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - name: on a GitHub-hosted runner only, set the bare image up (Python 3.14, uv, tmux, lsof)
        if: steps.plan.outputs.run == 'true'
        uses: ./.github/actions/hosted-tools
        with:
          tools: tmux lsof
          python: "3.14"
          uv: "true"
      - name: on a GitHub-hosted runner only, web/.venv for tests/neutral-install.sh (its web check runs offline from a warm uv cache, which a bare runner has not)
        if: runner.environment == 'github-hosted' && steps.plan.outputs.run == 'true'
        run: if [ -f web/pyproject.toml ]; then cd web && uv sync --frozen; fi
      - name: what the suites need (tmux; cc for the fake claude; python3; lsof and flock for the process and lock helpers)
        if: steps.plan.outputs.run == 'true'
        run: |
          for t in tmux cc python3 flock lsof setsid; do command -v "$t" >/dev/null || { echo "missing on the runner: $t"; exit 1; }; done
          tmux -V; cc --version | head -1; python3 --version; command -v flock lsof
      - name: this shard's suites, side by side (a PR, the suites its change reaches; a merge-queue entry, every tests/*.sh, a new suite by its file alone)
        if: steps.plan.outputs.run == 'true'
        env:
          SUITES: ${{ needs.changes.outputs.suites }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          # a queue entry always runs the full set: a suite the PR's map missed fails here, before the merge, instead of never
          # A hosted runner has two or four CPUs: every suite at once (run.sh's default) starved the timing checks
          # (a first hosted trial failed eight suites on clocks and waits alone), so a hosted runner runs two suites per CPU at a time
          j=(); if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then j=(-j "$(( $(nproc) * 2 ))"); echo "hosted runner: at most ${j[1]} suites at once"; fi
          if [ -n "$SUITES" ] && [ "$SUITES" != all ]; then
              echo "suites for this change: $SUITES"; bash tests/run.sh "${j[@]}" --shard "$SHARD/$SHARDS" $SUITES
          else
              echo "every suite"; bash tests/run.sh "${j[@]}" --shard "$SHARD/$SHARDS"
          fi
  suites:
    # The gate over suites-shard: the check named `suites` that the branch ruleset, release.sh, the merge queue and `gate` read. It passes
    # only when every shard passed. When `changes` says no suite is needed (a docs-only PR, a push to main), the shards and this job are
    # skipped together, which release.sh reads as a verdict.
    needs: [changes, suites-shard]
    if: always() && needs.changes.outputs.sala == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every suites-shard job passed
        env:
          SHARDS_RESULT: ${{ needs.suites-shard.result }}
        run: '[ "$SHARDS_RESULT" = success ] || { echo "the suites-shard jobs ended as $SHARDS_RESULT"; exit 1; }'
  web-shard:
    # The web app under web/: its own pytest, the way its README runs it, in six shards that run side by side (the serial
    # job took about 71 minutes on a two-CPU hosted runner for 2152 tests, too near the timeout). Each shard runs its share of the
    # test files serially (.github/scripts/web-shard.sh deals them out by their recorded times, web/tests/timings.json, so a new
    # file is picked up by its name and weighs the median until a refresh records it: SHARDING BY RECORDED TIMES above); no
    # pytest-xdist, because parallel workers in one job gave load-dependent failures in the browser tests. The check every
    # consumer reads is the `web` job below, which gathers the shards. Runs on a PR that changed web/ and on every queue entry;
    # inert until web/ exists (changed.sh says web=false without web/pyproject.toml).
    name: web-shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false   # every shard reports, so one red shard does not hide another's failures
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: scratch goes to the runner's temp folder
        run: echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"   # the runner context is not available in a job-level env, so this is a step
      - uses: actions/checkout@v4
      - name: on a GitHub-hosted runner only, set the bare image up (Python 3.14, uv, tmux, ttyd 1.7.7, and a check that Chrome is there)
        uses: ./.github/actions/hosted-tools
        with:
          tools: tmux ttyd chrome
          python: "3.14"
          uv: "true"
      - name: what the web app needs (uv; node for the syntax check of its scripts)
        run: |
          for t in uv node; do command -v "$t" >/dev/null || { echo "missing on the runner: $t"; exit 1; }; done
          uv --version; node --version
      - name: uv sync --frozen (the lockfile as committed)
        working-directory: web
        run: uv sync --frozen
      - name: pytest over this shard's test files
        working-directory: web
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}   # the length of the matrix above
        run: |
          files=$(../.github/scripts/web-shard.sh "$SHARD" "$SHARDS")
          echo "shard $SHARD of $SHARDS: $(echo "$files" | wc -l) test files"
          uv run --frozen pytest $files
      - name: node --check over the app's scripts under src/ (vendored files left out; shard 1 only, the check is the same in every shard)
        if: matrix.shard == 1
        working-directory: web
        run: find src -name '*.js' -not -path '*/vendor/*' -not -path '*/node_modules/*' -print0 | xargs -0 -r -n1 node --check
  web:
    # The gate over web-shard: the check named `web` that release.sh, the merge queue and any required-check rule read. It passes
    # only when every shard passed. When `changes` says the web tests are not needed (a PR that left web/ alone, a push to main),
    # the shards and this job are skipped together, which release.sh reads as a verdict.
    needs: [changes, web-shard]
    if: always() && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: every web-shard job passed
        env:
          SHARDS_RESULT: ${{ needs.web-shard.result }}
        run: '[ "$SHARDS_RESULT" = success ] || { echo "the web-shard jobs ended as $SHARDS_RESULT"; exit 1; }'
  gate:
    # The one job that always runs on every event, and the check sala's merge queue reads (.github/mergequeue.toml `required`): that queue judges a check completed without `success` as failed, and `suites` and `web`
    # are skipped when a change does not need them. Fails when `changes`, `suites` or `web` failed or was cancelled; success and skipped pass. Not a required check of the branch rule or of GitHub's queue (those name
    # `changes`, `suites` and `web` themselves).
    needs: [changes, suites, web]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: changes, suites and web each passed or were not needed
        env:
          RESULTS: changes=${{ needs.changes.result }} suites=${{ needs.suites.result }} web=${{ needs.web.result }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "${r#*=}" in success|skipped) ;; *) echo "not passed: $r"; exit 1 ;; esac
          done
