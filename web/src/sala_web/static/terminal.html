<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>terminal</title>
<!-- The full-size terminal: the Shell drawer's "Open full size" link, and the old /?arg=<session> links, land here instead of on ttyd's
     own page. It is ttyd's page in a frame that fills the window, so that termclip.js can put the clipboard code on it (the OSC 52
     copy, the Copy button, Ctrl+V as a paste), which ttyd's page has none of. Served by the app like the main page, under the same
     login as the main page; the ttyd frame is the same /tty/ the Terminal tab uses. -->
<!-- the sala icon (the tab icon below) keeps the app icons' own orange, which is also the dark theme's orange: it stays when the page palette changes -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f1f21'/%3E%3Cpath d='M9 11l6 5-6 5M18 22h6' stroke='%23f0a06a' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="static/termclip.css?v={{v}}">
<!-- the color tool, stored look only: colortool.js (stackshot's shared file, pinned) and sala's wiring apply the look chosen on the main page, before the first
     paint. There is no button on this page; the Terminal itself stays black -->
<script src="static/colortool.js?v={{v}}"></script>
<script src="static/colortool-sala.js?v={{v}}"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; }   /* the Terminal stays black, in either theme */
  .term-full { position: fixed; inset: 0; display: flex; }
  .term-full iframe { flex: 1; border: 0; width: 100%; height: 100%; background: #000; }
</style>
</head>
<body>
<div id="term-full" class="term-full"></div>
<script src="static/termclip.js?v={{v}}"></script>
<script src="static/terminal.js?v={{v}}"></script>
</body>
</html>
