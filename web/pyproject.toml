[project]
name = "sala-web"
version = "0.1.0"
description = "Web UI for the Claude Code sessions running in tmux on this machine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
sala-web = "sala_web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sala_web"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
